name: Production availability monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-availability-monitor
  cancel-in-progress: true

jobs:
  health-check:
    name: Check public production endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage and manifest
        shell: bash
        env:
          PRODUCTION_BASE_URL: https://anibloom.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 \
            "$PRODUCTION_BASE_URL/" -o "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error --location --max-time 15 \
            "$PRODUCTION_BASE_URL/manifest.json" -o "$RUNNER_TEMP/manifest.json"
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text())
          expected = {
              "current_season",
              "previous_season",
              "upcoming_season",
              "upcoming_season_movies",
              "current_season_movies",
              "previous_season_movies",
              "upcoming_3_days",
              "previous_3_days",
          }
          catalogs = manifest.get("catalogs", [])
          actual = [entry.get("id") for entry in catalogs]
          if set(actual) != expected or len(actual) != len(expected):
              raise SystemExit(f"Unexpected production catalog contract: {actual!r}")
          if manifest.get("types") != ["series", "movie"]:
              raise SystemExit("Production manifest does not advertise series and movie types")
          print(f"Homepage and manifest are healthy; addon version {manifest.get('version')}")
          PY

      - name: Check representative catalog endpoint
        shell: bash
        env:
          PRODUCTION_BASE_URL: https://anibloom.vercel.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 35 --retry 1 --retry-delay 2 \
            --write-out '\nCatalog response time: %{time_total}s (HTTP %{http_code})\n' \
            "$PRODUCTION_BASE_URL/catalog/series/current_season.json" \
            -o "$RUNNER_TEMP/current-season.json"
          python3 - "$RUNNER_TEMP/current-season.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text())
          metas = payload.get("metas")
          if not isinstance(metas, list):
              raise SystemExit("Current-season catalog response is missing its metas array")
          if any(not isinstance(meta, dict) or not meta.get("id") for meta in metas):
              raise SystemExit("Current-season catalog contains malformed metadata entries")
          print(f"Current-season catalog is healthy; {len(metas)} metadata entries returned")
          PY
