name: Post-release catalog snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to snapshot (for manual capture)'
        required: true
        type: string
      release_sha:
        description: 'Exact deployed release commit SHA (for manual capture)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: catalog-snapshot
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message || '', '[capture-catalog]')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          INPUT_VERSION: ${{ inputs.release_version || '' }}
          INPUT_SHA: ${{ inputs.release_sha || '' }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          state = json.loads(Path("ops/release-state.json").read_text())
          version = os.environ.get("INPUT_VERSION", "").strip() or state["lastDeploymentVersion"]
          sha = os.environ.get("INPUT_SHA", "").strip() or state["lastDeploymentSha"]

          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"Invalid release version: {version}")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("Release SHA must be a full 40-character commit SHA")
          if state["lastDeploymentVersion"] != version and not os.environ.get("INPUT_VERSION", "").strip():
              raise SystemExit("Current release state does not identify a deployed release")

          print(f"version={version}")
          print(f"sha={sha}")
          print(f"tag=v{version}")
          PY

      - name: Capture all production catalog pages
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRODUCTION_BASE_URL: https://nuvio-anime-release-addon-v2.vercel.app
        run: |
          set -euo pipefail
          snapshot_dir="/tmp/catalog-snapshot"
          rm -rf "$snapshot_dir"
          mkdir -p "$snapshot_dir/pages"

          curl_args=(--fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors)
          curl "${curl_args[@]}" "$PRODUCTION_BASE_URL/manifest.json" -o "$snapshot_dir/manifest.json"

          python - "$snapshot_dir/manifest.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1]))
          expected = {
              "current_season",
              "previous_season",
              "upcoming_season",
              "upcoming_5_days",
              "previous_7_days",
          }
          actual = [entry.get("id") for entry in manifest.get("catalogs", [])]
          types = [entry.get("type") for entry in manifest.get("catalogs", [])]
          if set(actual) != expected or len(actual) != len(expected):
              raise SystemExit(f"Unexpected production catalog contract: {actual!r}")
          if manifest.get("types") != ["series"] or manifest.get("resources") != [{"name": "catalog", "types": ["series"]}]:
              raise SystemExit("Unexpected production series protocol contract")
          if any(value != "series" for value in types):
              raise SystemExit(f"Unexpected catalog protocol types: {types!r}")
          PY

          for catalog in current_season previous_season upcoming_season upcoming_5_days previous_7_days; do
            mkdir -p "$snapshot_dir/pages/$catalog"
            page=1
            skip=0
            total=0

            while true; do
              output="$snapshot_dir/pages/$catalog/page-$(printf '%04d' "$page").json"
              echo "Capturing $catalog page $page (skip=$skip)"
              request_url="$PRODUCTION_BASE_URL/catalog/series/$catalog.json?skip=$skip"
              http_status="$(curl --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
                --write-out '%{http_code}' \
                -o "$output" \
                "$request_url")"
              if [ "$http_status" != "200" ]; then
                echo "$catalog page $page returned HTTP $http_status" >&2
                exit 1
              fi

              python - "$snapshot_dir/pages/$catalog/page-$(printf '%04d' "$page").request.json" "$request_url" "$http_status" "$catalog" "$page" "$skip" <<'PY'
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          request_url = sys.argv[2]
          http_status = int(sys.argv[3])
          catalog = sys.argv[4]
          page = int(sys.argv[5])
          skip = int(sys.argv[6])

          output.write_text(json.dumps({
              "request": {
                  "method": "GET",
                  "url": request_url,
                  "catalog": catalog,
                  "page": page,
                  "query": {"skip": skip},
                  "body": None,
              },
              "response": {
                  "status": http_status,
                  "contentType": "application/json",
                  "bodyFile": f"page-{page:04d}.json",
              },
          }, indent=2, ensure_ascii=False) + "\n")
          PY

              count="$(python - "$output" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1]))
          metas = payload.get("metas")
          if not isinstance(metas, list):
              raise SystemExit("Response is missing a metas array")
          print(len(metas))
          PY
              )"

              total=$((total + count))
              if [ "$count" -eq 0 ]; then
                echo "Captured terminal empty page for $catalog at skip=$skip"
                break
              fi

              if [ "$count" -gt 50 ]; then
                echo "$catalog page $page returned $count items; expected at most 50" >&2
                exit 1
              fi

              page=$((page + 1))
              skip=$((skip + 50))

              if [ "$page" -gt 1000 ]; then
                echo "$catalog exceeded 1000 pages; refusing an unbounded capture" >&2
                exit 1
              fi
            done

            python - "$snapshot_dir/pages/$catalog" "$snapshot_dir/$catalog.json" "$catalog" <<'PY'
          import json
          import sys
          from pathlib import Path

          pages_dir = Path(sys.argv[1])
          output = Path(sys.argv[2])
          catalog = sys.argv[3]
          metas = []

          for page in sorted(pages_dir.glob("page-[0-9][0-9][0-9][0-9].json")):
              payload = json.loads(page.read_text())
              page_metas = payload.get("metas")
              if not isinstance(page_metas, list):
                  raise SystemExit(f"{page}: missing metas array")
              metas.extend(page_metas)

          output.write_text(json.dumps({"metas": metas}, ensure_ascii=False, separators=(",", ":")) + "\n")
          print(f"{catalog}: captured {len(metas)} results across {len(list(pages_dir.glob('page-*.json')))} pages")
          PY
          done

          python - "$snapshot_dir" "$RELEASE_VERSION" "$PRODUCTION_BASE_URL" <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          directory = Path(sys.argv[1])
          release_version = sys.argv[2]
          base_url = sys.argv[3]
          manifest = json.loads((directory / "manifest.json").read_text())

          if manifest.get("version") != release_version:
              raise SystemExit(
                  f"Production manifest version {manifest.get('version')!r} does not match release {release_version!r}"
              )

          catalogs = [
              "current_season",
              "previous_season",
              "upcoming_season",
              "upcoming_5_days",
              "previous_7_days",
          ]
          hashes = {}
          item_counts = {}
          page_counts = {}
          page_hashes = {}

          for name in catalogs:
              aggregate = directory / f"{name}.json"
              payload = json.loads(aggregate.read_text())
              metas = payload.get("metas")
              if not isinstance(metas, list):
                  raise SystemExit(f"{name}: missing metas array")
              item_counts[name] = len(metas)
              hashes[name] = hashlib.sha256(aggregate.read_bytes()).hexdigest()

              pages = sorted((directory / "pages" / name).glob("page-[0-9][0-9][0-9][0-9].json"))
              page_counts[name] = len(pages)
              page_hashes[name] = {
                  page.name: hashlib.sha256(page.read_bytes()).hexdigest()
                  for page in pages
              }
              request_pages = sorted((directory / "pages" / name).glob("page-*.request.json"))
              if len(request_pages) != len(pages):
                  raise SystemExit(f"{name}: request metadata count does not match response page count")
              page_hashes[f"{name}:requests"] = {
                  page.name: hashlib.sha256(page.read_bytes()).hexdigest()
                  for page in request_pages
              }

          hashes["manifest"] = hashlib.sha256((directory / "manifest.json").read_bytes()).hexdigest()

          metadata = {
              "schemaVersion": 3,
              "protocolType": "series",
              "legacyProtocolType": "anime",
              "requestCapture": "per-page GET request metadata and raw JSON response",
              "releaseVersion": release_version,
              "capturedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "productionBaseUrl": base_url,
              "pagination": {
                  "pageSize": 50,
                  "queryParameter": "skip",
                  "termination": "empty-page",
                  "maxPages": 1000,
              },
              "catalogs": catalogs,
              "itemCounts": item_counts,
              "pageCounts": page_counts,
              "sha256": hashes,
              "pageSha256": page_hashes,
          }
          (directory / "capture-metadata.json").write_text(json.dumps(metadata, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Compare against previous production snapshot
        id: diff
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          before_version="$(python - <<'PY'
          import re
          import subprocess
          import os

          current = os.environ["RELEASE_VERSION"]
          current_tuple = tuple(map(int, current.split(".")))
          raw_refs = subprocess.check_output(
              ["git", "ls-remote", "--heads", "origin", "refs/heads/catalog-snapshots/v*"],
              text=True,
          )
          versions = []
          for line in raw_refs.splitlines():
              ref = line.split("\t", 1)[-1].removeprefix("refs/heads/catalog-snapshots/")
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", ref)
              if match:
                  versions.append(tuple(map(int, match.groups())))

          candidates = [version for version in versions if version < current_tuple]
          if not candidates:
              print("")
          else:
              print(".".join(map(str, max(candidates))))
          PY
          )"

          if [ -z "$before_version" ]; then
            echo "No previous catalog snapshot exists; skipping release diff."
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf /tmp/catalog-diff
          mkdir -p /tmp/catalog-diff/before /tmp/catalog-diff/after /tmp/catalog-diff/output

          git fetch --quiet origin "catalog-snapshots/v$before_version"
          git archive "origin/catalog-snapshots/v$before_version" "ops/catalog-snapshots/v$before_version" |
            tar -x --strip-components=3 -C /tmp/catalog-diff/before

          cp /tmp/catalog-snapshot/*.json /tmp/catalog-diff/after/
          cp -R /tmp/catalog-snapshot/pages /tmp/catalog-diff/after/

          node scripts/compare-catalog-snapshots.js \
            /tmp/catalog-diff/before \
            /tmp/catalog-diff/after \
            /tmp/catalog-diff/output

          echo "has_previous=true" >> "$GITHUB_OUTPUT"
          echo "before_version=$before_version" >> "$GITHUB_OUTPUT"

      - name: Publish release diff artifact
        if: ${{ steps.diff.outputs.has_previous == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-diff-v${{ steps.diff.outputs.before_version }}-to-v${{ steps.release.outputs.version }}
          path: /tmp/catalog-diff/output/
          if-no-files-found: error
      - name: Persist release snapshot branch
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="catalog-snapshots/$RELEASE_TAG"
          git fetch --quiet origin "$RELEASE_SHA"
          git switch --detach "$RELEASE_SHA"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --quiet origin "$branch"
            git switch -C "$branch" "origin/$branch"
            git merge --ff-only "$RELEASE_SHA"
          else
            git switch -c "$branch"
          fi
          mkdir -p "ops/catalog-snapshots/$RELEASE_TAG/pages"
          cp /tmp/catalog-snapshot/*.json "ops/catalog-snapshots/$RELEASE_TAG/"
          cp -R /tmp/catalog-snapshot/pages/. "ops/catalog-snapshots/$RELEASE_TAG/pages/"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "ops/catalog-snapshots/$RELEASE_TAG"
          git commit -m "chore: capture $RELEASE_TAG catalog snapshot [skip-release-pipeline]"
          git push origin "HEAD:refs/heads/$branch"

          echo "Snapshot persisted to $branch"

# Release-state commits carry [capture-catalog] so each successful release is snapshotted automatically.
