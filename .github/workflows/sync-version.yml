name: CI, automatic patch versioning, and controlled Vercel release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Authorize the controlled production deployment'
        required: true
        default: false
        type: boolean
      finalize_release:
        description: 'Finalize an already-deployed production release without redeploying Vercel'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Validate a production release without deploying, tagging, or mutating release state'
        required: true
        default: false
        type: boolean
      release_target_sha:
        description: 'Exact release commit SHA; required for finalize_release and optional for deploy_prod'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  statuses: read
  actions: write

concurrency:
  group: main-release-pipeline
  cancel-in-progress: false

jobs:
  release-pipeline:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[deploy-prod]') || contains(github.event.head_commit.message || '', '[finalize-prod:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run full CI
        run: npm test

      - name: Determine release request
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_PROD: ${{ inputs.deploy_prod }}
          FINALIZE_RELEASE: ${{ inputs.finalize_release }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TARGET_SHA_INPUT: ${{ inputs.release_target_sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          normalize_target() {
            local target
            target="$(printf '%s' "$RELEASE_TARGET_SHA_INPUT" | tr -d '[:space:]')"
            if [[ -z "$target" ]]; then target="$GITHUB_SHA"; fi
            if [[ ! "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Release target SHA must be a full 40-character commit SHA." >&2
              return 1
            fi
            printf '%s' "$target"
          }
          if [[ "$EVENT_NAME" == "push" && "$COMMIT_MESSAGE" == *"[deploy-prod]"* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=true" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" && "$COMMIT_MESSAGE" =~ \[finalize-prod:([0-9a-fA-F]{40})\] ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DEPLOY_PROD" == "true" ]]; then
            target="$(normalize_target)"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=true" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$target" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$FINALIZE_RELEASE" == "true" ]]; then
            target="$(printf '%s' "$RELEASE_TARGET_SHA_INPUT" | tr -d '[:space:]')"
            if [[ ! "$target" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Finalize release requires a full 40-character commit SHA." >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$target" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            target="$(normalize_target)"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "release_target_sha=$target" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate repository release metadata
        if: steps.gate.outputs.release == 'true' || inputs.dry_run == true
        run: node scripts/release-integrity.mjs

      - name: Validate release state
        if: steps.gate.outputs.release == 'true' || inputs.dry_run == true
        env:
          REDEPLOY: ${{ steps.gate.outputs.redeploy }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import subprocess

          state = json.loads(Path("ops/release-state.json").read_text())
          expected = state["nextReleaseVersion"]
          if state["paused"] or state["deploymentsSincePause"] >= state["deploymentLimit"]:
              raise SystemExit("Deployment checkpoint reached.")

          target = os.environ["RELEASE_TARGET_SHA"]
          if not re.fullmatch(r"[0-9a-fA-F]{40}", target):
              raise SystemExit("Release target SHA must be a full 40-character commit SHA.")
          if os.environ["REDEPLOY"] == "true":
              version = re.search(r'ADDON_VERSION = "([^"]+)"', Path("api/version.js").read_text()).group(1)
          else:
              subprocess.run(["git", "fetch", "--quiet", "origin", target], check=True)
              version = re.search(
                  r'ADDON_VERSION = "([^"]+)"',
                  subprocess.check_output(["git", "show", f"{target}:api/version.js"], text=True),
              ).group(1)

          if version != expected:
              raise SystemExit(f"Release target version {version} does not match next release baseline {expected}.")
          PY
      - name: Revalidate current release state before deployment
        if: steps.gate.outputs.release == 'true' && inputs.dry_run != true
        env:
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          target_version="$(git show "${RELEASE_TARGET_SHA}:api/version.js" | sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p')"
          CURRENT_STATE="$(git show origin/main:ops/release-state.json)" TARGET_VERSION="$target_version" node --input-type=module <<'NODE'
          import { validateReleaseConcurrencyState } from "./scripts/release-integrity.mjs";
          const state = JSON.parse(process.env.CURRENT_STATE);
          validateReleaseConcurrencyState({ state, targetVersion: process.env.TARGET_VERSION });
          NODE
      - name: Check for an existing Vercel deployment
        if: steps.gate.outputs.release == 'true' && inputs.dry_run != true
        id: existing_vercel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
        run: |
          set -euo pipefail
          target="$RELEASE_TARGET_SHA"
          status_payload="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}/status")"
          deployment_id="$(printf '%s' "$status_payload" | node scripts/resolve-vercel-deployment-id.mjs || true)"
          if [ -n "$deployment_id" ]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
            echo "Existing successful Vercel deployment detected: $deployment_id"
          else
            echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
            echo "deployment_id=" >> "$GITHUB_OUTPUT"
            echo "No existing successful Vercel deployment found for target."
          fi
      - name: Trigger Vercel deployment
        if: steps.gate.outputs.release == 'true' && steps.gate.outputs.redeploy == 'true' && steps.existing_vercel.outputs.needs_deploy == 'true' && inputs.dry_run != true
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: test -n "$VERCEL_DEPLOY_HOOK_URL" && curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Production smoke test
        if: steps.gate.outputs.release == 'true' || inputs.dry_run == true
        env:
          REDEPLOY: ${{ steps.gate.outputs.redeploy }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$REDEPLOY" = "true" ]; then
            expected="$(sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p' api/version.js)"
          else
            git fetch --quiet origin "$RELEASE_TARGET_SHA"
            expected="$(git show "${RELEASE_TARGET_SHA}:api/version.js" | sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p')"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            production_expected="$(curl --fail --silent --show-error https://nuvio-anime-release-addon-v2.vercel.app/manifest.json | sed -nE 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"
            test -n "$production_expected"
          else
            production_expected="$expected"
          fi
          for attempt in $(seq 1 30); do
            root_manifest="$(curl --fail --silent --show-error https://nuvio-anime-release-addon-v2.vercel.app/manifest.json || true)"
            catalog="$(curl --fail --silent --show-error https://nuvio-anime-release-addon-v2.vercel.app/catalog/series/current_season.json || true)"
            movie_catalog="$(curl --fail --silent --show-error https://nuvio-anime-release-addon-v2.vercel.app/catalog/movie/current_season_movies.json || true)"
            legacy_catalog_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://nuvio-anime-release-addon-v2.vercel.app/catalog/anime/current_season.json || true)"
            meta_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://nuvio-anime-release-addon-v2.vercel.app/meta/series/mal%3A39535.json || true)"
            if EXPECTED="$production_expected" TARGET="$expected" ROOT="$root_manifest" CATALOG="$catalog" MOVIE_CATALOG="$movie_catalog" LEGACY_CATALOG_STATUS="$legacy_catalog_status" META_STATUS="$meta_status" python - <<'PY'
          import json
          import os
          import re

          root = json.loads(os.environ["ROOT"])
          catalog = json.loads(os.environ["CATALOG"])
          expected = os.environ["EXPECTED"]

          assert root.get("version") == expected
          assert root.get("id") == "com.marki.nuvio.anime-releases"
          assert root.get("identityMode") == "provider"
          assert root.get("resources") == [{"name": "catalog", "types": ["series", "movie"]}]
          assert root.get("types") == ["series", "movie"]
          assert root.get("catalogs") and all(c.get("type") == ("movie" if str(c.get("id", "")).endswith("_movies") else "series") for c in root["catalogs"])
          assert os.environ["LEGACY_CATALOG_STATUS"] == "200"
          assert os.environ["META_STATUS"] == "404"

          metas = catalog.get("metas", [])
          assert metas
          assert all(re.match(r"^(tt\d+|tvdb:[1-9]\d*|tmdb:[1-9]\d*|mal:[1-9]\d*)$", str(m.get("id", ""))) for m in metas)
          assert all(m.get("type") == "series" for m in metas)
          assert any(str(m.get("id", "")).startswith("tt") for m in metas)
          movie_catalog = json.loads(os.environ["MOVIE_CATALOG"])
          movie_metas = movie_catalog.get("metas", [])
          assert all(m.get("type") == "movie" for m in movie_metas)
          assert all(re.match(r"^(tt\d+|tvdb:[1-9]\d*|tmdb:[1-9]\d*|mal:[1-9]\d*|anilist:[1-9]\d*)$", str(m.get("id", ""))) for m in movie_metas)
          PY
            then
              echo "Production smoke test passed."
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Extended production validation
        if: steps.gate.outputs.release == 'true' || inputs.dry_run == true
        env:
          REDEPLOY: ${{ steps.gate.outputs.redeploy }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$REDEPLOY" = "true" ]; then
            expected="$(sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p' api/version.js)"
          else
            git fetch --quiet origin "$RELEASE_TARGET_SHA"
            expected="$(git show "${RELEASE_TARGET_SHA}:api/version.js" | sed -nE 's/export const ADDON_VERSION = "([^"]+)";/\1/p')"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            production_expected="$(curl --fail --silent --show-error https://nuvio-anime-release-addon-v2.vercel.app/manifest.json | sed -nE 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"
            test -n "$production_expected"
          else
            production_expected="$expected"
          fi
          for attempt in $(seq 1 30); do
            if EXPECTED_VERSION="$production_expected" PRODUCTION_BASE_URL="https://nuvio-anime-release-addon-v2.vercel.app" node scripts/validate-production.mjs; then
              echo "Extended production validation passed."
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Resolve Vercel deployment ID
        if: steps.gate.outputs.release == 'true' && inputs.dry_run != true
        id: vercel_deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
        run: |
          set -euo pipefail
          target="$RELEASE_TARGET_SHA"
          status_payload="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${target}/status")"
          deployment_id="$(printf '%s' "$status_payload" | node scripts/resolve-vercel-deployment-id.mjs)"
          test -n "$deployment_id"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Resolved Vercel deployment ID: $deployment_id"

      - name: Create annotated release tag, GitHub Release, and update release state
        if: steps.gate.outputs.release == 'true' && inputs.dry_run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.vercel_deployment.outputs.deployment_id }}
          REDEPLOY: ${{ steps.gate.outputs.redeploy }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
        run: |
          set -euo pipefail
          release_version="$(python -c 'import json;print(json.load(open("ops/release-state.json"))["nextReleaseVersion"])')"
          tag="v$release_version"

          if [[ "$REDEPLOY" == "true" ]]; then
            target="$(node scripts/release-target.mjs deploy "$GITHUB_SHA")"
          else
            target="$(node scripts/release-target.mjs finalize "$RELEASE_TARGET_SHA")"
            git cat-file -e "$target^{commit}"
          fi

          git fetch --tags --force
          previous="$(git tag --merged "$target^" --sort=-version:refname --list 'v*' | head -n1 || true)"
          if [ -n "$previous" ]; then
            range="$previous..$target"
          else
            range="$target"
          fi

          summary="$(python - "$range" "$tag" <<'PY'
          import re
          import subprocess
          import sys

          commit_range, tag = sys.argv[1:]
          subjects = subprocess.check_output(
              ["git", "log", "--reverse", "--no-merges", "--pretty=format:%s", commit_range],
              text=True,
          ).splitlines()

          seen = set()
          highlights = []
          categories = []

          for subject in subjects:
              subject = re.sub(r"\s*\[[^]]+\]", "", subject).strip()
              kind, separator, text = subject.partition(": ")
              kind = kind.lower() if separator else ""
              text = text.strip() if separator else subject.strip()

              if kind in {"chore", "test", "release"}:
                  continue
              if kind == "fix":
                  categories.append("reliability")
                  line = text
              elif kind in {"feat", "feature"}:
                  categories.append("features")
                  line = text
              elif kind == "refactor":
                  categories.append("maintenance")
                  line = "Improved the internal organization and reliability of the addon."
              elif kind == "perf":
                  categories.append("performance")
                  line = "Improved addon performance and efficiency."
              elif kind in {"docs", "documentation"}:
                  categories.append("documentation")
                  line = "Improved documentation and guidance."
              else:
                  continue

              line = re.sub(r"\s+", " ", line).strip().rstrip(".") + "."
              key = line.lower()
              if key not in seen:
                  seen.add(key)
                  highlights.append(line)

          overview = []
          if "features" in categories:
              overview.append("This release adds new user-facing functionality.")
          if "reliability" in categories:
              overview.append("It improves reliability and accuracy when identifying anime across different sources.")
          if "maintenance" in categories:
              overview.append("It improves the internal structure of the addon to make future fixes safer and more reliable.")
          if "performance" in categories:
              overview.append("It includes performance and efficiency improvements.")
          if not overview:
              overview = ["This release contains improvements to the addon."]

          print(f"Release {tag}\n\nOverview")
          for item in overview:
              print(item)
          print("\nHighlights")
          for line in highlights[:12]:
              print(f"- {line}")
          if not highlights:
              print("- General reliability and maintenance improvements.")
          PY
          )"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            existing_target="$(git rev-list -n1 "$tag^{commit}")"
            test "$existing_target" = "$target"
            test "$(git cat-file -t "refs/tags/$tag")" = "tag"
          else
            git tag -a "$tag" "$target" -m "$summary"
            git push origin "refs/tags/$tag"
          fi

          test "$(git cat-file -t "refs/tags/$tag")" = "tag"
          test "$(git rev-list -n1 "$tag^{commit}")" = "$target"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$summary"
          fi

          git pull --rebase origin main
          python - "$target" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from datetime import datetime, timezone
          import re

          path = Path("ops/release-state.json")
          state = json.loads(path.read_text())
          version = state["nextReleaseVersion"]
          major, minor, patch = map(int, version.split("."))
          deployments = state["deploymentsSincePause"] + 1

          state["deploymentsSincePause"] = deployments
          state["totalDeployments"] += 1
          state["paused"] = deployments >= state["deploymentLimit"]
          state["lastDeploymentSha"] = sys.argv[1]
          state["lastDeploymentId"] = os.environ["VERCEL_DEPLOYMENT_ID"]
          state["lastDeploymentVersion"] = version
          state["nextReleaseVersion"] = f"{major}.{minor + 1}.0"
          state["lastDeploymentTag"] = "v" + version
          state["lastDeployment"] = {
              "version": version,
              "sha": state["lastDeploymentSha"],
              "vercelDeploymentId": state["lastDeploymentId"],
              "tag": state["lastDeploymentTag"],
              "releasedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "ciRunId": os.environ["GITHUB_RUN_ID"],
              "ciRunUrl": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "smokeTest": "passed",
          }

          path.write_text(json.dumps(state, indent=2) + "\n")
          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = re.sub(r"(\*\*Production:\*\*\s*)`[^`]+`", rf"\g<1>`v{version}`", readme)
          readme_path.write_text(readme)
          PY
          git add ops/release-state.json README.md
          git commit -m "chore: record $tag production release [skip-release-pipeline] [capture-catalog]"
          git push origin HEAD:main

      - name: Trigger post-release catalog snapshot
        if: steps.gate.outputs.release == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ steps.gate.outputs.release_target_sha }}
        run: |
          set -euo pipefail
          release_version="$(python -c 'import json;print(json.load(open("ops/release-state.json"))["lastDeploymentVersion"])')"
          gh workflow run catalog-snapshot.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_version="$release_version" \
            -f release_sha="$RELEASE_TARGET_SHA"
