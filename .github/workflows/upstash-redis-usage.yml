name: Upstash Redis usage monitor

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstash-redis-usage-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check monthly Redis quotas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Read Upstash monthly usage
        env:
          UPSTASH_API_EMAIL: ${{ secrets.UPSTASH_API_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_REDIS_DATABASE_ID: ${{ vars.UPSTASH_REDIS_DATABASE_ID }}
        run: node scripts/check-upstash-redis-usage.js