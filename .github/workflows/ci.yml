name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message || '', '[deploy-prod]') && !contains(github.event.head_commit.message || '', '[finalize-prod:') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
      - name: Bump patch version and sync metadata
        if: github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[skip-version-automation]') && !contains(github.event.head_commit.message || '', '[major-release]')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version_path = Path("api/version.js")
          current = re.search(r'ADDON_VERSION = "([^"]+)"', version_path.read_text()).group(1)
          major, minor, patch = map(int, current.split("."))
          next_version = f"{major}.{minor}.{patch + 1}"
          version_path.write_text(f'export const ADDON_VERSION = "{next_version}";\n')

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["version"] = next_version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme = re.sub(r"version-\d+\.\d+\.\d+-blue", f"version-{next_version}-blue", readme)
          readme = re.sub(r"(\*\*Development:\*\*\s*)`v?[^`]+`", rf"\g<1>`v{next_version}`", readme)
          readme_path.write_text(readme)
          PY
      - name: Verify versioned tree
        run: npm test
      - name: Open version metadata pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- api/version.js package.json README.md; then
            echo "Version metadata is unchanged; no pull request is needed."
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/version.js package.json README.md
          git commit -m "chore: bump patch version [skip-version-automation]"
          branch="automation/version-bump-${GITHUB_SHA:0:12}"
          git switch -c "$branch"
          git push --force origin "HEAD:refs/heads/$branch"

          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Version metadata pull request already exists: $existing_pr"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore: bump patch version [skip-version-automation]" \
              --body "Automated patch-version metadata update generated from main commit $GITHUB_SHA. This pull request keeps main protected and runs the normal pull-request CI before the metadata is merged."
          fi