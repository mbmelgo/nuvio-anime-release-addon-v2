name: Rolling catalog diff

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-catalog-diff
  cancel-in-progress: false

jobs:
  capture-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capture every production catalog page
        env:
          BASE_URL: https://nuvio-anime-release-addon-v2.vercel.app
        run: |
          set -euo pipefail
          work=/tmp/rolling-catalog
          current="$work/current"
          mkdir -p "$current/pages"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' "$BASE_URL/manifest.json" -o "$current/manifest.json"

          python - "$current/manifest.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          expected = {"current_season", "previous_season", "upcoming_season", "upcoming_3_days", "previous_3_days"}
          catalogs = manifest.get("catalogs", [])
          ids = [c.get("id") for c in catalogs]
          if set(ids) != expected or len(ids) != len(expected):
              raise SystemExit(f"Unexpected catalog contract: {ids!r}")
          if manifest.get("types") != ["series"] or manifest.get("resources") != [{"name": "catalog", "types": ["series"]}]:
              raise SystemExit("Unexpected production protocol contract")
          if any(c.get("type") != "series" for c in catalogs):
              raise SystemExit("Catalog type is not series")
          PY

          for catalog in current_season previous_season upcoming_season upcoming_3_days previous_3_days; do
            mkdir -p "$current/pages/$catalog"
            skip=0
            page=1
            total=0
            while [ "$page" -le 1000 ]; do
              file="$current/pages/$catalog/page-$(printf '%04d' "$page").json"
              headers="$current/pages/$catalog/page-$(printf '%04d' "$page").headers"
              url="$BASE_URL/catalog/series/$catalog.json?skip=$skip"
              status="$(curl --silent --show-error --location --retry 3 --retry-all-errors \
                -H 'Cache-Control: no-cache' -D "$headers" -o "$file" -w '%{http_code}' "$url")"
              test "$status" = 200 || { echo "$catalog skip=$skip returned HTTP $status" >&2; exit 1; }
              count="$(python - "$file" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1]))
          metas = payload.get("metas")
          if not isinstance(metas, list):
              raise SystemExit("Response missing metas array")
          if len(metas) > 50:
              raise SystemExit("Page exceeded 50 metas")
          print(len(metas))
          PY
              )"
              total=$((total + count))
              [ "$count" -gt 0 ] || break
              skip=$((skip + 50))
              page=$((page + 1))
            done
            [ "$page" -le 1000 ] || { echo "$catalog exceeded page limit" >&2; exit 1; }
            python - "$current/pages/$catalog" "$current/$catalog.json" <<'PY'
          import json, sys
          from pathlib import Path
          root, output = Path(sys.argv[1]), Path(sys.argv[2])
          metas = []
          for path in sorted(root.glob("page-[0-9][0-9][0-9][0-9].json")):
              payload = json.loads(path.read_text())
              metas.extend(payload["metas"])
          output.write_text(json.dumps(metas, ensure_ascii=False, indent=2) + "\n")
          print(f"{output.stem}: {len(metas)} items")
          PY
          done

          git fetch origin catalog-rolling-snapshot 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/catalog-rolling-snapshot; then
            mkdir -p "$work/before"
            git archive origin/catalog-rolling-snapshot | tar -x -C "$work/before"
            old_version="$(python - "$work/before/capture-metadata.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["releaseVersion"])
          PY
            )"
            old_patch="${old_version##*.}"
            new_patch=$((old_patch + 1))
            new_version="1.0.$new_patch"
            python - "$current" "$new_version" <<'PY'
          import json, sys
          from pathlib import Path
          root, version = Path(sys.argv[1]), sys.argv[2]
          (root / "capture-metadata.json").write_text(json.dumps({
              "schemaVersion": 1,
              "protocolType": "series",
              "releaseVersion": version,
              "capturedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "productionBaseUrl": "https://nuvio-anime-release-addon-v2.vercel.app",
              "catalogs": ["current_season", "previous_season", "upcoming_season", "upcoming_3_days", "previous_3_days"],
              "cacheNote": "Requests sent with Cache-Control: no-cache; see saved response headers for CDN cache evidence."
          }, indent=2) + "\n")
          PY
            node scripts/compare-catalog-snapshots.js "$work/before" "$current" "$work/output"
            cat "$work/output/release-diff.md"
            mkdir -p "$work/artifact"
            cp "$work/output/"release-diff.* "$work/artifact/"
            cp "$current/capture-metadata.json" "$work/artifact/"
            cp "$current/manifest.json" "$work/artifact/"
          else
            echo "No rolling baseline exists yet; initializing baseline without reporting a diff."
            new_version="1.0.0"
            python - "$current" "$new_version" <<'PY'
          import json, sys
          from pathlib import Path
          root, version = Path(sys.argv[1]), sys.argv[2]
          (root / "capture-metadata.json").write_text(json.dumps({
              "schemaVersion": 1,
              "protocolType": "series",
              "releaseVersion": version,
              "capturedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "productionBaseUrl": "https://nuvio-anime-release-addon-v2.vercel.app",
              "catalogs": ["current_season", "previous_season", "upcoming_season", "upcoming_3_days", "previous_3_days"],
              "cacheNote": "Requests sent with Cache-Control: no-cache; see saved response headers for CDN cache evidence."
          }, indent=2) + "\n")
          PY
          fi

          # Keep only the latest complete snapshot on the dedicated rolling branch.
          mkdir -p "$work/next"
          cp "$current/"*.json "$work/next/"
          cp -R "$current/pages" "$work/next/pages"
          git checkout --orphan rolling-next
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$work/next/." .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add capture-metadata.json manifest.json current_season.json previous_season.json upcoming_season.json upcoming_3_days.json previous_3_days.json pages
          git commit -m "chore: update rolling catalog baseline"
          git push --force origin HEAD:catalog-rolling-snapshot

      - name: Upload rolling diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-catalog-diff-${{ github.run_id }}
          path: /tmp/rolling-catalog/artifact/
          if-no-files-found: ignore
          retention-days: 30
